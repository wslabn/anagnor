name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: anagnor.exe
            asset_name: anagnor-windows.exe
          - os: ubuntu-latest
            artifact_name: anagnor
            asset_name: anagnor-linux
          - os: macos-latest
            artifact_name: anagnor
            asset_name: anagnor-macos

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements-build.txt

    - name: Build executable
      run: |
        pyinstaller anagnor.spec --clean

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Prepare artifacts
      run: |
        ls -la
        cp anagnor-windows.exe/anagnor.exe windows-anagnor.exe
        cp anagnor-linux/anagnor linux-anagnor
        cp anagnor-macos/anagnor macos-anagnor
        chmod +x linux-anagnor macos-anagnor

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows-anagnor.exe
          linux-anagnor
          macos-anagnor
        body: |
          ## Anagnor Network Assessment Tool
          
          ### Downloads
          - **Windows**: anagnor-windows.exe
          - **Linux**: anagnor-linux  
          - **macOS**: anagnor-macos
          
          ### Usage
          ```bash
          # Make executable (Linux/Mac)
          chmod +x anagnor-linux
          
          # Run scan
          sudo ./anagnor-linux
          ```
          
          ### Requirements
          - Administrator/root privileges
          - Network access to target ranges
          - nmap (auto-installed)